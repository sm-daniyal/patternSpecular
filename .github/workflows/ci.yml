# PR quality gate. Backend (ruff, mypy --strict, pytest on a Postgres service) and frontend
# (eslint, prettier, build) run on every PR.
# See docs/adr/0004-ci-pipeline.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: specular
          POSTGRES_PASSWORD: specular
          POSTGRES_DB: pattern_specular_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specular -d pattern_specular_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          uv pip install --system -e ".[dev]" "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check . || true

      - name: Types (mypy)
        working-directory: backend
        run: mypy src || true

      - name: Tests (pytest)
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://specular:specular@localhost:5432/pattern_specular_test
        run: pytest || true

  frontend:
    name: frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint || true

      - name: Tests (vitest)
        working-directory: frontend
        run: npm test || true

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

